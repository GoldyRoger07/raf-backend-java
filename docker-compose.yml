# =============================================================================
# RAF - MySQL + backend + site (vitrine et back-office) + app joueur
#
#   cp .env.example .env     (puis remplir les valeurs)
#   docker compose up -d --build
#
#   site / back-office : http://localhost:4000  (/admin)
#   app joueur (PWA)   : http://localhost:8100  (nginx, relaie /api au backend)
#   backend            : http://localhost:8081
#   MySQL              : localhost:3307 (3306 reste libre pour un MySQL local)
#   images             : http://localhost:8100/media/... (volume media-data)
#
# Les images emballent ce qui a ete compile sur la machine (Dockerfile.local) :
#   .\mvnw.cmd -q clean package -DskipTests
#   npm run build    dans ../raf-frontend-ssr et dans ../raf-ionic
#
# Le site est construit depuis ../raf-frontend-ssr. Il appelle le backend depuis
# le navigateur, a l'adresse ecrite dans son code (http://localhost:8081) : le
# serveur Node ne parle jamais au backend.
# =============================================================================

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?a definir dans .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-raf}
      MYSQL_USER: ${MYSQL_USER:-raf}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?a definir dans .env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.local
    image: raf-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # Le reste de la configuration (JWT, mail, IA...) vient de .env.
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-prod}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-raf}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:-raf}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SERVER_PORT: 8081
      # Le backend ecrit les images dans le volume ; nginx (player) les sert.
      MEDIA_STORAGE_DIR: /data/media
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-http://localhost:8100/media}
    volumes:
      - media-data:/data/media
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8081"

  frontend:
    build:
      context: ../raf-frontend-ssr
      dockerfile: Dockerfile.local
    image: raf-frontend-ssr
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Le serveur SSR refuse toute requete dont l'en-tete Host n'est pas liste
      # (protection SSRF d'Angular). En production : le nom de domaine du site.
      NG_ALLOWED_HOSTS: ${FRONTEND_ALLOWED_HOSTS:-localhost}
    ports:
      - "${FRONTEND_HOST_PORT:-4000}:4000"

  player:
    build:
      context: ../raf-ionic
      dockerfile: Dockerfile.local
    image: raf-player
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      # Lecture seule : nginx sert les images, il ne peut ni les modifier ni en ajouter.
      - media-data:/usr/share/nginx/media:ro
    ports:
      - "${PLAYER_HOST_PORT:-8100}:80"

volumes:
  mysql-data:
  # Images televersees. A sauvegarder avec la base :
  #   docker run --rm -v raf-backend-java_media-data:/data -v ${PWD}:/backup alpine tar czf /backup/media.tgz -C /data .
  media-data:
