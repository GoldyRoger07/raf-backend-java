spring.application.name=raf
spring.profiles.active=${APP_ENV:dev}

# Les secrets vivent dans .env.<env>.properties, jamais dans ce fichier.
spring.config.import=optional:file:./.env.properties,optional:file:./.env.${APP_ENV:dev}.properties

server.port=${SERVER_PORT:8081}
server.error.include-message=never
server.error.include-stacktrace=never

# --- Supervision -----------------------------------------------------------
# Seul /actuator/health est expose (healthcheck Docker), sans detail : l'etat
# de la base ou du serveur SMTP n'a pas a etre public. Le serveur SMTP n'entre
# pas dans le calcul : une panne d'envoi ne doit pas faire redemarrer le backend.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# --- Base de donnees -------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.pool-name=raf-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
# READ COMMITTED et non REPEATABLE READ (defaut MySQL) : chaque lecture voit ce
# qui est commite. Sous REPEATABLE READ, une lecture faite avant un verrou fige
# l'instantane, et les comptages faits ensuite sous le verrou (plafond de
# tickets, seuil de joueurs) ignorent les achats commites pendant l'attente.
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# Le schema est pilote par Flyway. Hibernate se contente de le valider.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Serialisation ---------------------------------------------------------
# Jackson 3 serialise les dates en ISO-8601 par defaut.
spring.jackson.default-property-inclusion=non_null

# --- OpenAPI ---------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

# --- Application -----------------------------------------------------------
app.base-url=${APP_BASE_URL:http://localhost:8081}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=raf
app.jwt.access-token-ttl=${JWT_EXPIRATION:15m}
app.jwt.refresh-token-ttl=${JWT_REFRESH_EXPIRATION:30d}

app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:8100}

# console : aucun envoi, l'email est affiche dans la console du serveur (tests).
# smtp    : envoi reel par le serveur SMTP ci-dessous (Spring Mail).
app.mail.mode=${MAIL_MODE:console}
app.mail.from=${MAIL_FROM:contact@rafhaiti.com}
app.mail.from-name=${MAIL_FROM_NAME:RAF}

# Serveur SMTP. Sans hote, aucun envoi : l'email est affiche en console.
# Port 587 + STARTTLS (defaut) ; pour le port 465, MAIL_SMTP_SSL=true et
# MAIL_SMTP_STARTTLS=false.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.otp.length=6
app.otp.ttl=10m
app.otp.max-attempts=5
app.otp.resend-cooldown=60s

app.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
app.push.vapid-subject=${VAPID_SUBJECT:mailto:contact@rafhaiti.com}

# --- Medias (images) -------------------------------------------------
# Fichiers sur le disque du serveur. En Docker : un volume, servi par nginx.
# public-url : adresse publique du dossier, sans / final. Elle n'est pas
# ecrite en base : changer de domaine ne demande aucune migration.
app.media.storage-dir=${MEDIA_STORAGE_DIR:./data/media}
app.media.public-url=${MEDIA_PUBLIC_URL:http://localhost:8081/media}

# Le controle de taille du service (5 Mo) doit pouvoir s'exprimer : sans
# cela, Spring refuse tout fichier au-dela de 1 Mo avant meme de l'appeler.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.verification.email-token-ttl=24h
app.verification.password-reset-ttl=1h

# --- Generation de questions par IA ------------------------------
# none      : desactivee (le back-office l'indique).
# anthropic : API Claude (AI_MODEL par defaut : claude-sonnet-5-5).
# openai    : toute API compatible OpenAI ; AI_BASE_URL change le fournisseur
#             (ex. https://api.mistral.ai/v1, http://localhost:11434/v1 pour Ollama).
app.ai.provider=${AI_PROVIDER:none}
app.ai.model=${AI_MODEL:}
app.ai.api-key=${AI_API_KEY:}
app.ai.base-url=${AI_BASE_URL:}
app.ai.timeout=${AI_TIMEOUT:180s}

# --- Rapprochement comptable ---------------------------------------
# Chaque nuit a 3 h, heure d'Haiti. Lancement manuel : POST /api/admin/reconciliation/runs
app.reconciliation.cron=${RECONCILIATION_CRON:0 0 3 * * *}
app.reconciliation.zone=America/Port-au-Prince

# --- Amorcage du premier administrateur ---------------------------
# Laisser vide desactive la creation. Ne touche jamais un compte existant.
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-phone=${BOOTSTRAP_ADMIN_PHONE:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
