# =============================================================================
# Profil des tests d'integration : MySQL local, base dediee raf_test.
#
# La base est videe puis recreee par Flyway a chaque lancement (voir
# TestInfrastructure) ; l'effacement refuse toute base dont le nom ne finit pas
# par "_test". Identifiants : ceux de .env.dev.properties. Une autre base peut
# etre visee avec la variable TEST_DB_URL (son nom doit aussi finir par _test).
# =============================================================================

spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/raf_test?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
spring.flyway.clean-disabled=false

# Les tests pilotent eux-memes les transitions : pas d'ordonnanceur en parallele.
app.scheduling.enabled=false

app.mail.mode=console

# Medias ecrits sous target/ : efface par mvn clean, jamais dans le depot.
app.media.storage-dir=target/test-media
app.media.public-url=http://media.test/media

# Pas de delai entre deux codes : les tests en enchainent plusieurs par joueur.
app.otp.resend-cooldown=0s

# Pas de compte administrateur amorce : les tests creent leurs propres comptes.
app.bootstrap.admin-email=
app.bootstrap.admin-phone=
app.bootstrap.admin-password=

logging.level.com.raikiservice.raf=WARN
logging.level.org.hibernate.SQL=WARN
