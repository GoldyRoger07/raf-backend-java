# =============================================================================
# RAF - Surcouche de production, a combiner avec docker-compose.yml :
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Caddy est le seul point d'entree (80 et 443) et obtient seul les certificats
# HTTPS (Let's Encrypt) : les enregistrements DNS de SITE_DOMAIN et APP_DOMAIN
# doivent deja pointer vers le serveur au premier demarrage.
#
#   https://SITE_DOMAIN        site vitrine + back-office (/admin), /api -> backend
#   https://APP_DOMAIN         app joueur (nginx, qui relaie /api et sert /media)
#
# Aucun autre port n'est publie : MySQL et le backend ne sont joignables que
# depuis le reseau Docker. Un acces direct au backend permettrait d'envoyer un
# X-Forwarded-For invente et de contourner les plafonds de tentatives par IP.
# =============================================================================

services:
  mysql:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      MEDIA_PUBLIC_URL: https://${APP_DOMAIN:?a definir dans .env}/media
    healthcheck:
      # L'image minimale n'a ni curl ni wget : requete HTTP a la main avec bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    ports: !reset []
    environment:
      NG_ALLOWED_HOSTS: ${SITE_DOMAIN:?a definir dans .env}
      API_PROXY_URL: ""

  player:
    ports: !reset []

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - player
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?a definir dans .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  # Certificats et cles TLS : a conserver, sinon Let's Encrypt est resollicite
  # a chaque recreation (limite de 5 certificats identiques par semaine).
  caddy-data:
  caddy-config:
